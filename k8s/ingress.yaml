apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tag-management
  namespace: prakarsa
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: no-middleware-dev-api.prakarsa.id
      http:
        paths:
          - path: /api/v1/tag-management
            pathType: Prefix
            backend:
              service:
                name: tag-management
                port:
                  number: 80